# Governing equations of the ChamberCylinder block (documentation).
#
# Reduced thick-walled cylindrical left-ventricle model of Genet et al. (2023),
# "Reduced left ventricular dynamics modeling based on a cylindrical
# assumption", Int. J. Numer. Meth. Biomed. Engng., e3711.
#
# Unlike ChamberSphere.yaml (a symbolic residual list for a lumped 0D block),
# this model is a 1D finite-element problem across the wall thickness, assembled
# numerically in ChamberCylinder.cpp rather than generated symbolically. This
# file documents the continuous governing equations that the C++ code
# discretizes; it is NOT a code-generation input. The block implements the
# single faithful genet23 configuration: Bestel-Clement-Sorine (BCS) active law,
# ECG-derived activation nu(t), mixed u/p incompressibility, and full dynamics
# (inertia). It is integrated with the L-stable "stiff" time integrator.

# --- Kinematic unknowns (Eq. 1) ---
# Radial fields (linear finite elements over R in [Ri, Re]):
#   rho(R)  : radial displacement            r     = R + rho
#   phi(R)  : in-plane (circumferential) shear
#   eta(R)  : out-of-plane (longitudinal) shear
#   p(R)    : hydrostatic pressure (mixed u/p Lagrange multiplier, Eqs. 26-27)
# Global scalars:
#   beta    : twist per unit length          theta = Theta + beta*Z + phi
#   eps     : longitudinal strain            z     = (1+eps)*Z + eta
# Per quadrature point: BCS active internal variables e_c, tau_c, k_c.
# Per block: cavity volume V and shared cavity pressure Pv = Pin = Pout.
# Dynamics adds velocity-companion DOFs (the material rates of rho, phi, eta,
# beta, eps) so the inertial term can be assembled as a first-order system.

# --- Deformation (Eqs. 13-16), a=1+rho', b=1+rho/R, e=1+eps ---
deformation_gradient: |
  F = [[ a,        0,   0        ],
       [ R*b*phi', b,   R*b*beta ],
       [ eta',     0,   e        ]]        # mixed (e_R, e_Theta, e_Z) basis
volume_ratio: "J = a * b * e"
green_lagrange_strain: "E = 0.5 * (F^T F - I)"

# --- Fiber orientation (Eq. 22), helix angle linear through the wall ---
fiber_direction: |
  alpha(R) = alpha_endo*(Re-R)/(Re-Ri) + alpha_epi*(R-Ri)/(Re-Ri)
  e_F = (0, cos(alpha), sin(alpha))         # circumferential-longitudinal plane

# --- Second Piola-Kirchhoff stress split (Eqs. 23-33) ---
constitutive_law: |
  Sigma = Sigma_d + Sigma_b + Sigma_v + Sigma_a
  # deviatoric, transversely isotropic (Eq. 25), isochoric invariants of Cbar=J^{-2/3}C
  We  = C1*(I1b-3) + C2*(I2b-3) + C3*exp(C4*(I1b-3)^2) + C5*exp(C6*(I4b-1)^2)
  Sigma_d = dWe/dE
  # incompressibility: mixed u/p Lagrange-multiplier pressure (Eqs. 26-27)
  Sigma_b = p * J * Cinv
  # viscous, isotropic Kelvin-Voigt (Eq. 28)
  Sigma_v = gamma * Edot
  # active fiber stress (Eqs. 29-33): Sigma_a = sigma_1D * (e_F outer e_F), with
  #   sigma_1D = (tau_c + mu*e_c_dot) / (1 + e_fib),   1 + e_fib = sqrt(I4)
  # Per quadrature point, 3 BCS internal variables e_c, tau_c, k_c evolve via
  # (Chapelle 2012 Eqs. 9-10):
  #   mu e_c_dot = k_s (e_fib - e_c) - tau_c                 (series-spring balance)
  #   tau_c_dot  = -(|nu| + alpha|e_c_dot|) tau_c + e_c_dot k_c + n0(e_c) sigma0 |nu|_+
  #   k_c_dot    = -(|nu| + alpha|e_c_dot|) k_c   + n0(e_c) k0    |nu|_+
  # nu = ECG-derived activation rate (nagumo waveform from tsys/tdias/act_qrs/
  # act_ramp/alpha_max/alpha_min); alpha = bcs_alpha (Table-1 = 12); n0(e_c) = a
  # fixed piecewise-linear Frank-Starling recruitment factor. Writing sigma_1D
  # through tau_c + mu*e_c_dot keeps the stiff k_s (= 1e8) out of the mechanical
  # residual.

# --- Governing equations ---
equations:
  # 1. Principle of virtual power (Eqs. 17-20), reduced to 1D over the thickness
  #    and assembled with finite elements; includes the inertial (acceleration)
  #    term rho_0 * a[u] (Eq. 18) with the reference volume element R dR dTheta dZ:
  #      2*pi*L * int_{Ri}^{Re} (rho_0 a . Du(zeta_hat) + Sigma : dE(zeta_hat)) R dR
  #        = Pv*2*pi*L*(Ri+rho(Ri))*(1+eps)*rho_hat(Ri)
  #          + Pv*pi*L*(Ri+rho(Ri))^2 * eps_hat
  #    tested against rho (per node), phi' (per node), eta' (per node), beta, eps.
  equilibrium: "2*pi*L * int (rho0*a.Du + Sigma:dE) R dR - P_external = 0"
  # 2. Incompressibility weak form (mixed u/p, Eq. 27)
  incompressibility: "int (J - 1) * p_hat R dR = 0"
  # 3. Velocity-companion definitions (dynamics): rate_field - d(field)/dt = 0
  velocity: "zeta_dot - d(zeta)/dt = 0"
  # 4. Cavity volume (Eq. 4)
  volume: "V - pi*(Ri+rho(Ri))^2*(1+eps)*L = 0"
  # 5. Conservation of mass (net inflow drives cavity volume change)
  mass: "Qin - Qout - dV/dt = 0"
  # 6. Cavity pressure equality
  pressure: "Pin - Pout = 0"
  # 7. BCS active internal-variable ODEs per quadrature point (see constitutive_law):
  #    e_c (series-spring balance), tau_c, k_c
  active_bcs: "mu*e_c_dot - [k_s(e_fib-e_c) - tau_c] = 0 ; tau_c_dot = ... ; k_c_dot = ..."
  # 8. Rigid-body pins (Sec. 2.4): block Z-translation and Z-rotation
  pins: "phi(Ri) = 0 ; eta(Ri) = 0"

# Numerical note: genet23 uses a bespoke energy-consistent midpoint scheme with a
# mixed finite-element formulation. This block instead reuses the svZeroDSolver
# DAE framework with the L-stable "stiff" integrator (generalized-alpha at
# maximal dissipation + damped-Newton line search + adaptive sub-stepping), which
# is required to carry the stiff BCS law (k_s = 1e8). The one documented residual
# is that the ventricular torsion untwists ~100 ms too early under the full
# damping model; see ChamberCylinder_provenance for the analysis.
