variables:
  - Pin
  - Qin
  - Pout
  - Qout
  - radius
  - velo
  - stress
  - tau
  - volume

derivatives:
  - dPin_dt
  - dQin_dt
  - dPout_dt
  - dQout_dt
  - dradius_dt
  - dvelo_dt
  - dstress_dt
  - dtau_dt
  - dvolume_dt

# Order must match the ParamId enum in ChamberSphere.h so that
# global_param_ids[ParamId::<name>] lines up with the calibration parameters.
constants:
  - rho
  - thick0
  - radius0
  - W1
  - W2
  - eta
  - sigma_max
  - alpha_max
  - alpha_min
  - tsys
  - tdias
  - steepness

# In-cycle time of the activation. Not a state variable and not a calibration
# parameter (no Jacobian column), but the activation depends on it.
time_symbol: t

helper_functions: |
  from sympy import Abs, Max, tanh

  def CG(radius):
      return (1 + (radius / radius0)) ** 2

  def dCG(radius, dradius_dt):
      return 2 * (1 + (radius / radius0)) * (1 / radius0) * dradius_dt

  # Active contraction activation, identical to
  # ChamberSphere::get_elastance_values. warp_signed wraps the phase into one
  # cardiac cycle; its derivative with respect to its argument is 1.
  phase_tsys = warp_signed(t - tsys)
  phase_tdias = warp_signed(t - tdias)
  S_plus = 0.5 * (1.0 + tanh(phase_tsys / steepness))
  S_minus = 0.5 * (1.0 - tanh(phase_tdias / steepness))
  f = S_plus * S_minus
  act_t = alpha_max * f + alpha_min * (1 - f)
  act = Abs(act_t)
  act_plus = Max(act_t, 0)

residuals:
  - rho * thick0 * dvelo_dt + (thick0 / radius0) * (1 + (radius / radius0)) * stress - Pout * CG(radius)
  - -stress + tau + 4 * (1 - CG(radius) ** (-3)) * (W1 + CG(radius) * W2) + eta * dCG(radius, dradius_dt) * (1 + 2 * CG(radius) ** (-6))
  - 4 * pi * radius0 ** 2 * CG(radius) * velo - dvolume_dt
  - dtau_dt + act * tau - sigma_max * act_plus
  - dradius_dt - velo
  - Qin - Qout - dvolume_dt
  - Pin - Pout
